items:
- id: construction:bedroll-camp
  name: Bedroll Camp
  type: structure
  icon: gear
  mode: original-construction-proposal
  magic: false
  record_kind: structure
  evidence_ref: bastions
  entity_id: publication:bastions-2024
  estimated_value_gp: 10
  tldr: Packable shelter for four; no comfort magic or guard service.
  details: 'Original 2024 campaign proposal. Packable shelter for four; no comfort
    magic or guard service. Estimated footprint: 10 by 10 feet; height 5 feet. Estimated
    construction: 1 workers for 1 days in ordinary conditions. Price includes ordinary
    materials and construction labor; excludes land, permissions, extraordinary site
    preparation, furnishings not named, ongoing staffing, supplies and taxes. The
    DM confirms costs and site suitability. This grants no official Bastion orders,
    special-facility benefits or class features.'
  changes: Independent system-compatible construction concept. No sourcebook cost
    table or official special-facility effect has been ported.
  flavor: Its character will come from the people who build and maintain it.
  creative: Combine it with complementary facilities in a site plan; shared walls,
    utility connections and bulk discounts require a DM-approved budget.
  structure:
    schema_version: 1
    kind: facility
    scale: camp
    footprint:
      width_ft: 10
      length_ft: 10
      height_ft: 5
    construction:
      cost_gp: '10'
      workers: 1
      days: 1
      materials_summary: canvas, rope, bedding
      cost_includes:
      - ordinary-materials
      - construction-labor
      cost_excludes:
      - land
      - permits
      - extraordinary-site-work
      - ongoing-staff
      - operating-supplies
      - taxes
      estimate_status: project-house-rule-not-RAW
    capacity:
      occupants: 4
      status: design-estimate
    maintenance:
      gp_per_30_days: '1'
      status: author-estimate-excludes-staff-and-supplies
    defenses:
      armor_class: null
      hit_points: null
      damage_threshold: null
      status: DM-object-and-siege-rules-required
    placement:
      requires_site_review: true
      connection_rules_implemented: false
    automation_status: data-only-not-a-building-simulator
  tags:
  - construction-scale:camp
  - construction-status:proposal

drafts:
- id: thunder-rift:sleep-powder
  name: Zanzer’s Sleep Powder
  type: consumable
  icon: potion
  rarity: uncommon
  estimated_value_gp: 100
  attunement: false
  evidence_ref: zanzer-knight
  entity_id: publication:zanzer
  locator: PDF p. 2, jail encounter / PDF p. 5, rooms 3–4 / PDF p. 7, pit encounter
  tldr: A single-use dust that can briefly incapacitate one creature.
  details: As a Magic action, expend one packet and choose one creature within 5 feet that breathes. It makes a
    DC 12 Constitution saving throw. On a failure, it has the Unconscious condition until the end of your next turn.
    Damage ends the effect; another creature can take an action to wake it. A creature immune to being Charmed automatically
    succeeds. The powder cannot affect a creature holding its breath. There is no lingering cloud.
  changes: Original bounded conversion; replaces legacy breath saves and repeated sleep with a short single-target
    effect. No nonmagical crafting recipe supplied.
  flavor: 'The paper folds bear a smudged warning: keep your face turned away.'
  creative: A risky close-range opening for a retreat. Unconscious targets fall Prone and drop held objects under
    the normal condition rules.
  setting_id: thunder-rift
  legacy_page_verified: true
- id: thunder-rift:robes-of-defense
  name: Zanzer’s Robes of Defense
  type: clothing
  icon: clothing
  rarity: uncommon
  estimated_value_gp: 400
  attunement: true
  evidence_ref: zanzer-knight
  entity_id: publication:zanzer
  locator: PDF p. 5; room 4
  tldr: Protective robes offer an alternate AC calculation.
  details: Requires attunement. While wearing these robes and wearing no armor or shield, you can calculate your
    Armor Class as 13 + your Dexterity modifier. Choose this or another available AC calculation; they do not stack.
    These robes grant no armor training, saving throw bonus, or spell slots.
  changes: One original 2024 draft replaces several descending-AC robe grades. Legacy AC 7/5/3 are not imported
    as additive modern bonuses.
  flavor: Silver thread catches the light just before a blade reaches the cloth.
  creative: Dress for a formal audience while retaining this AC option. Disguise success remains a DM ruling.
  setting_id: thunder-rift
  legacy_page_verified: true
- id: thunder-rift:mercy-mace
  name: Zanzer’s Mercy Mace
  type: weapon
  icon: hammer
  rarity: rare
  estimated_value_gp: 4010
  attunement: true
  evidence_ref: zanzer-knight
  entity_id: publication:zanzer
  locator: PDF p. 8; room 10
  tldr: A +1 mace with a small daily reserve of healing.
  details: Requires attunement. Uses the 2024 Mace rules and grants +1 to attack and damage rolls made with it.
    Once per Long Rest, as a Magic action while holding it, touch one willing creature to restore 2d8 Hit Points.
    This property has no effect on Constructs or Undead. It does not require a successful weapon attack and cannot
    be delivered through an attack.
  changes: Project name and fixed healing replace a legacy +1 mace with daily Cure Serious Wounds; this is not a
    verified official named item.
  flavor: The striking face is stern; the grip is worn smooth by gentler hands.
  creative: Help a fallen ally without spending a class spell slot; reaching them safely remains your problem.
  setting_id: thunder-rift
  legacy_page_verified: false
  base_item_id: open5e-srd-2024:srd-2024_mace
- id: thunder-rift:owlbear-ring
  name: Ring of Owlbear Accord
  type: ring
  icon: ring
  rarity: rare
  estimated_value_gp: 4000
  attunement: true
  evidence_ref: goblin-ring-lead
  entity_id: publication:palace-of-dread
  locator: 'Search excerpt: goblin king equipment; original page unverified'
  tldr: Try to pacify one owlbear once per day.
  details: Requires attunement. Once per Long Rest, as a Magic action, choose one Owlbear you can see within 30
    feet. It makes a DC 13 Wisdom saving throw, with Advantage if you or your allies are fighting it. On a failure,
    it has the Charmed condition with respect to you for up to 1 minute, requiring your Concentration. The effect
    ends if you or an ally damages it. You gain no command, telepathy, or control over its actions. It may still
    attack your allies.
  changes: Original lower-control design inspired by an unverified Ring of Owl Bear Control mention. Targets Owlbear
    explicitly rather than assuming it qualifies for Beast-only magic. Legacy rarity is not carried across.
  flavor: Two watchful eyes are cut into the ring’s bronze brow.
  creative: Buy a moment to back away or negotiate a route around a nest. The ring cannot guarantee safe passage
    for companions.
  setting_id: thunder-rift
  legacy_page_verified: false
- id: mystara:shield-halav-echo
  name: Shield of Halav (Pilgrim’s Echo)
  type: shield
  icon: shield
  rarity: rare
  estimated_value_gp: 4010
  attunement: true
  evidence_ref: halav
  entity_id: publication:hail-the-heroes
  locator: 'Fan lore article: relic identity; original mechanics unverified'
  tldr: A protective shield inspired by the Traladaran relic.
  details: Requires attunement. Uses the 2024 Shield rules and adds +1 to the AC bonus normally granted by a shield.
    Once per Long Rest, when a creature you can see within 5 feet of you takes damage, you can use your Reaction
    to reduce that damage by 1d8 + your Proficiency Bonus, to a minimum of 0. You must be wielding the shield. The
    target may be you.
  changes: Original lesser echo, not the canonical artifact or a full port of its powers. No ancestry, religion,
    alignment, or class restriction is inferred.
  flavor: A weathered bronze face carries an oath older than the road beneath your feet.
  creative: Guard a companion crossing a dangerous threshold. Saving the Reaction means giving up another possible
    Reaction.
  setting_id: mystara
  legacy_page_verified: false
  associations:
  - entity_id: region:karameikos
    role: cultural-association
    status: fan-lore-regional-association
    evidence:
      url: https://www.pandius.com/zadreth.html
  - entity_id: culture:traladaran
    role: cultural-association
    status: fan-lore-cultural-association
    evidence:
      url: https://www.pandius.com/zadreth.html
  base_item_id: open5e-srd-2024:srd-2024_shield
- id: thunder-rift:academy-healers-shield
  name: Academy Healer’s Shield
  setting_id: thunder-rift
  type: shield
  icon: shield
  rarity: uncommon
  estimated_value_gp: 410
  attunement: true
  evidence_ref: rift-path
  entity_id: publication:haunted-tower
  locator: haunted-tower component treasure list (fan index; original page unverified)
  tldr: A training shield with one daily healing touch.
  details: Requires attunement. Uses the 2024 Shield rules. Once per Long Rest, as a Magic action while wielding
    it, touch one willing creature to restore 1d8 + your Proficiency Bonus Hit Points. This property has no effect
    on Constructs or Undead. It grants no additional AC beyond an ordinary shield.
  changes: New project name and fixed healing adapt a fan-listed normal shield with daily Cure Light Wounds. Not
    a verified official named item.
  flavor: A faded academy badge marks the hand that brings a comrade home.
  creative: Keep your shield ready while stabilizing the line. Healing still costs your action.
  base_item_id: open5e-srd-2024:srd-2024_shield
- id: thunder-rift:vampire-lord-water-staff
  name: Staff of the Stillwater Watch
  setting_id: thunder-rift
  type: staff
  icon: staff
  rarity: rare
  estimated_value_gp: 4000
  attunement: true
  evidence_ref: rift-path
  entity_id: publication:haunted-tower
  locator: haunted-tower component treasure list (fan index; original page unverified)
  tldr: A water-themed staff for breathing and cold protection.
  details: Requires attunement. While holding the staff, you have Resistance to Cold damage. Once per Long Rest,
    as a Magic action, touch one willing creature; it can breathe underwater for 1 hour. This does not grant a Swim
    Speed, immunity to pressure, or the ability to speak underwater. The staff can be used as a 2024 Quarterstaff,
    without an attack or damage bonus.
  changes: Original lesser adaptation of the fan-listed Staff of Water. Removes elemental summoning and legacy +2
    weapon/save modifiers.
  flavor: Ripples travel through the wood when the halls grow silent.
  creative: Explore a flooded passage with a rope and a surface lookout; breathing does not solve every underwater
    hazard.
  base_item_id: open5e-srd-2024:srd-2024_quarterstaff
- id: thunder-rift:otterkin-divers-staff
  name: Otterkin Diver’s Staff
  setting_id: thunder-rift
  type: staff
  icon: staff
  rarity: uncommon
  estimated_value_gp: 400
  attunement: true
  evidence_ref: rift-path
  entity_id: publication:dragons-den
  locator: dragons-den component treasure list (fan index; original page unverified)
  tldr: Grant a companion a short underwater scouting window.
  details: Requires attunement. Once per Long Rest, as a Magic action while holding this staff, touch one willing
    creature to let it breathe underwater for 10 minutes. While the effect lasts, that creature has Advantage on
    Strength (Athletics) checks made to swim. It gains no Swim Speed. The staff can be used as a 2024 Quarterstaff,
    without an attack or damage bonus.
  changes: Original duration, frequency and swim-check benefit inspired by a fan-listed otterkin-made waterbreathing
    staff. Cultural maker attribution is unverified; no new species statistics or automatic proficiency.
  flavor: River reeds are bound beneath the smooth, worn grip.
  creative: Scout under a moored boat. Current, visibility and encumbrance still matter.
  base_item_id: open5e-srd-2024:srd-2024_quarterstaff
- id: thunder-rift:red-serpent-firegoad
  name: Red Serpent Firegoad
  setting_id: thunder-rift
  type: wand
  icon: wand
  rarity: uncommon
  estimated_value_gp: 400
  attunement: true
  evidence_ref: rift-path
  entity_id: publication:dragons-den
  locator: dragons-den component treasure list (fan index; original page unverified)
  tldr: A wand produces a small close-range fire burst.
  details: Requires attunement. The wand has 3 charges and regains 1d3 expended charges at dawn, to a maximum of
    3. As a Magic action, expend 1 charge and choose one creature you can see within 30 feet. It makes a DC 13 Dexterity
    saving throw, taking 2d6 Fire damage on a failure or half as much on a success. The wand does not ignite worn
    or carried objects.
  changes: Original ranged save, damage, recharge and name adapt a fan-listed Wand of Firegoad. No legacy command
    or unknown rules inferred.
  flavor: A coal-red bead shifts behind the wand’s forked tip.
  creative: Draw attention away from an ally, though the target is not compelled to pursue you.
  base_item_id: null
